<h2>Lina 1.3.1</h2>
<ul>
<li>Cuentas: cuando el registro falla, el motivo aparece ahora en tu idioma y con palabras claras (contraseña rechazada, el operador no responde…), en lugar de un mensaje en francés o técnico.</li>
<li>Una transferencia rechazada también indica su motivo en tu idioma.</li>
</ul>
